name: Bruin
description: >-
  Bruin is an end-to-end, open-source AI data platform that consolidates data
  ingestion, SQL and Python transformation, orchestration, quality checks,
  column-level lineage, and natural-language analytics into a single Git-native
  tool - positioned as a replacement for a fragmented Fivetran + dbt + Airflow +
  BI stack. Its developer surface is the open-source Bruin CLI (Apache-2.0, Go),
  the ingestr data-copy tool (MIT), a Python SDK, a VS Code extension, a GitHub
  Action, and a built-in Model Context Protocol server (`bruin mcp`) plus a set
  of packaged agent skills. Bruin Cloud adds a hosted control plane with
  scheduling and dashboards. Bruin is SOC 2 Type 2 audited and GDPR-compliant,
  and was a Techstars portfolio company. There is no public REST API; the
  platform is operated through the CLI, SDK, and MCP server.
